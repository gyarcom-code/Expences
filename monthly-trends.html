<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Динаміка за місяцями</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    color-scheme: light dark;
    --page-bg: #f4f5f3;
    --surface: #ffffff;
    --text-primary: #12181a;
    --text-secondary: #5b6560;
    --border: rgba(18, 24, 26, .10);
    --accent: #0f6e63;
    --accent-contrast: #ffffff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg: #14171a;
      --surface: #1c2024;
      --text-primary: #f2f4f3;
      --text-secondary: #9aa39d;
      --border: rgba(255, 255, 255, .10);
      --accent: #3ab6a3;
      --accent-contrast: #14171a;
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tabs a {
    padding: 10px 14px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs a:hover { color: var(--text-primary); }
  .tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }

  #status { color: var(--text-secondary); font-size: 14px; }

  #years-checkboxes { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 20px; }
  #years-checkboxes label { cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  #years-checkboxes input { accent-color: var(--accent); width: 15px; height: 15px; }

  .inflation-toggle { margin-bottom: 20px; }
  .inflation-toggle label { cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); }
  .inflation-toggle input { accent-color: var(--accent); width: 15px; height: 15px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 20px; }

  #averages-widget { margin-bottom: 20px; }
  #averages-widget > div { margin-bottom: 6px; }
  #averages-widget > div:last-child { margin-bottom: 0; }
  #averages-widget .avg-label { color: var(--text-secondary); margin-right: 8px; font-size: 13px; }
  .avg-chip {
    display: inline-block;
    border: 1px solid;
    border-radius: 999px;
    padding: 4px 12px;
    margin-right: 8px;
    font-weight: 600;
    font-size: 13px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  #chart-wrap.card { overflow-x: auto; padding: 16px; }
  #chart-wrap canvas { height: 460px !important; }

  @media (max-width: 640px) {
    body { padding: 16px 12px 40px; }
  }
</style>
</head>
<body>

<h1>Динаміка за місяцями</h1>
<nav class="tabs">
  <a href="index.html">Головна</a>
  <a href="monthly-trends.html" class="active">Динаміка</a>
  <a href="category-trends.html">Категорії</a>
</nav>
<div id="status">Завантаження даних...</div>

<div id="years-checkboxes"></div>
<div class="inflation-toggle">
  <label><input type="checkbox" id="inflation-checkbox"> Врахувати параметри інфляції в Україні</label>
</div>
<div id="averages-widget"></div>

<div id="chart-wrap" class="card"><canvas id="chart"></canvas></div>

<script src="data.js"></script>
<script src="settings.js"></script>
<script src="inflation.js"></script>
<script>
const COLORS = isDarkMode() ? THEME_COLORS.categorical.dark : THEME_COLORS.categorical.light;

let allRows = [];
let inflationData = null;
let chart = null;

function getQueryYear() {
  const params = new URLSearchParams(window.location.search);
  const year = parseInt(params.get('year'), 10);
  return isNaN(year) ? null : year;
}

async function init() {
  try {
    [allRows, inflationData] = await Promise.all([fetchExpenseRows(), fetchInflationData()]);
  } catch (err) {
    document.getElementById('status').textContent = 'Помилка: ' + err.message;
    return;
  }
  if (allRows.length === 0) {
    document.getElementById('status').textContent = 'Немає даних для відображення.';
    return;
  }
  document.getElementById('status').textContent = '';

  document.getElementById('inflation-checkbox').onchange = renderChart;

  const years = [...new Set(allRows.map(r => r.year))].sort((a, b) => b - a);
  const preselected = getQueryYear();
  renderYearCheckboxes(years, preselected !== null && years.includes(preselected) ? preselected : years[0]);
  renderChart();
}

function renderYearCheckboxes(years, defaultYear) {
  const container = document.getElementById('years-checkboxes');
  container.innerHTML = '';
  years.forEach(year => {
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = year;
    checkbox.checked = year === defaultYear;
    checkbox.onchange = renderChart;
    label.appendChild(checkbox);
    label.append(' ' + year);
    container.appendChild(label);
  });
}

function getCheckedYears() {
  return [...document.querySelectorAll('#years-checkboxes input:checked')].map(cb => parseInt(cb.value, 10));
}

function renderChart() {
  const checkedYears = getCheckedYears();
  const inflationEnabled = document.getElementById('inflation-checkbox').checked;
  const yearStats = [];

  const datasets = checkedYears.map((year, i) => {
    const nominalTotals = new Array(12).fill(0);
    for (const r of allRows) {
      if (r.year === year) nominalTotals[r.month - 1] += r.amount;
    }
    const adjustedTotals = nominalTotals.map((v, idx) => v > 0 ? adjustForInflation(v, year, idx + 1, inflationData) : 0);

    const color = COLORS[i % COLORS.length];
    const nominalAverage = computeMonthlyAverage(nominalTotals);
    const adjustedAverage = computeMonthlyAverage(adjustedTotals);
    yearStats.push({ year, nominalAverage, adjustedAverage, color });

    const activeTotals = inflationEnabled ? adjustedTotals : nominalTotals;
    const activeAverage = inflationEnabled ? adjustedAverage : nominalAverage;
    const pointColors = activeTotals.map(v => getOveragePointColor(v, activeAverage, color));
    return {
      label: String(year),
      data: activeTotals,
      borderColor: color,
      backgroundColor: color,
      pointBackgroundColor: pointColors,
      pointBorderColor: pointColors,
      fill: false,
      tension: 0.1
    };
  });

  renderAveragesWidget(yearStats);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: MONTH_NAMES, datasets },
    options: {
      maintainAspectRatio: false,
      plugins: {
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${formatCurrency(ctx.parsed.y)}` } }
      },
      scales: { y: { beginAtZero: true, ticks: { callback: value => formatCurrency(value) } } }
    }
  });
}

function buildChipRow(labelText, yearStats, valueFn) {
  const row = document.createElement('div');
  const label = document.createElement('span');
  label.className = 'avg-label';
  label.textContent = labelText;
  row.appendChild(label);
  yearStats.forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'avg-chip';
    chip.style.borderColor = s.color;
    chip.style.color = s.color;
    chip.textContent = `${s.year}: ${formatCurrency(valueFn(s))}`;
    row.appendChild(chip);
  });
  return row;
}

function renderAveragesWidget(yearStats) {
  const container = document.getElementById('averages-widget');
  container.innerHTML = '';
  container.appendChild(buildChipRow('Середнє за місяць:', yearStats, s => s.nominalAverage));
  container.appendChild(buildChipRow('Середнє за місяць (з урахуванням інфляції):', yearStats, s => s.adjustedAverage));
}

init().catch(err => {
  document.getElementById('status').textContent = 'Помилка: ' + err.message;
});
</script>

</body>
</html>
