<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Витрати за категоріями</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    color-scheme: light dark;
    --page-bg: #f4f5f3;
    --surface: #ffffff;
    --text-primary: #12181a;
    --text-secondary: #5b6560;
    --border: rgba(18, 24, 26, .10);
    --accent: #0f6e63;
    --accent-contrast: #ffffff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg: #14171a;
      --surface: #1c2024;
      --text-primary: #f2f4f3;
      --text-secondary: #9aa39d;
      --border: rgba(255, 255, 255, .10);
      --accent: #3ab6a3;
      --accent-contrast: #14171a;
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; }
  h2 { font-size: 17px; font-weight: 600; margin: 36px 0 12px; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 18px;
    line-height: 1;
    display: inline-block;
    vertical-align: middle;
    color: var(--text-secondary);
    user-select: none;
  }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tabs a {
    padding: 10px 14px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs a:hover { color: var(--text-primary); }
  .tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }

  #status { color: var(--text-secondary); font-size: 14px; }

  #notifications { margin-bottom: 20px; }
  .notification-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border: 1px solid #fab219;
    border-left-width: 4px;
    border-radius: var(--radius-sm);
    background: color-mix(in srgb, #fab219 12%, var(--surface));
    font-size: 14px;
    margin-bottom: 8px;
  }
  .notification-banner:last-child { margin-bottom: 0; }
  .notification-banner .material-symbols-outlined { color: #fab219; }

  #filters-row { display: grid; grid-template-columns: 1fr 220px; align-items: start; gap: 20px; margin-bottom: 24px; }
  #filters-row > div:first-child { min-width: 0; }
  #years { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: min(360px, 100%); }
  #months button.all-months { grid-column: 1 / -1; }
  #months button:disabled {
    cursor: not-allowed;
    color: var(--text-secondary);
    background: transparent;
    border-color: var(--border);
    opacity: .45;
  }
  #months button:disabled:hover { border-color: var(--border); }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-primary);
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
  }

  .widgets-col { display: flex; flex-direction: column; gap: 12px; }

  #total-widget, #avg-widget {
    text-align: center;
    white-space: nowrap;
  }
  #total-widget { cursor: pointer; transition: border-color .15s ease; }
  #total-widget:hover { border-color: var(--accent); }
  #total-widget .label, #avg-widget .label { color: var(--text-secondary); font-size: 13px; }
  #total-widget .amount, #avg-widget .amount { display: block; margin-top: 4px; font-size: 22px; font-weight: 600; color: var(--accent); }

  #chart-wrap.card { overflow-x: auto; padding: 16px; }
  #chart-wrap canvas { height: 460px !important; }

  .table-wrap { overflow-x: auto; }
  #big-table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 13px; }
  #big-table th, #big-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  #big-table th { color: var(--text-secondary); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  #big-table td:nth-child(3) { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  #big-table tbody tr:hover { background: var(--page-bg); }
  .cat-cell { display: flex; align-items: center; gap: 8px; }

  .threshold-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .threshold-row label { font-size: 13px; color: var(--text-secondary); }
  .threshold-row input {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    width: 110px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-primary);
  }
  .threshold-row input:focus { outline: none; border-color: var(--accent); }

  @media (max-width: 640px) {
    body { padding: 16px 12px 40px; }
    #filters-row { grid-template-columns: 1fr; }
    #total-widget { width: 100%; }
  }
</style>
</head>
<body>

<div id="notifications"></div>

<h1>Витрати за категоріями</h1>
<nav class="tabs">
  <a href="index.html" class="active">Головна</a>
  <a href="monthly-trends.html">Динаміка</a>
  <a href="category-trends.html">Категорії</a>
</nav>
<div id="status">Завантаження даних...</div>

<div id="filters-row">
  <div>
    <div id="years"></div>
    <div id="months"></div>
  </div>
  <div class="widgets-col">
    <div id="total-widget" class="card" title="Перейти до динаміки за місяцями">
      <div class="label">Всього за <span id="total-period"></span></div>
      <span class="amount mono" id="total-amount"></span>
    </div>
    <div id="avg-widget" class="card">
      <div class="label">Середнє за місяць</div>
      <span class="amount mono" id="avg-amount"></span>
    </div>
  </div>
</div>

<div id="chart-wrap" class="card"><canvas id="chart"></canvas></div>

<h2>Великі витрати</h2>
<div class="threshold-row">
  <label for="threshold-input">Поріг (більше, ₴):</label>
  <input type="number" id="threshold-input" value="8000" min="0" step="100">
  <button id="threshold-apply">Застосувати</button>
</div>
<div class="table-wrap card">
  <table id="big-table">
    <thead>
      <tr><th>Дата</th><th>Категорія</th><th>Сума</th><th>Коментар</th></tr>
    </thead>
    <tbody id="big-table-body"></tbody>
  </table>
</div>

<script src="data.js"></script>
<script src="settings.js"></script>
<script src="inflation.js"></script>
<script>
let bigAmountThreshold = 8000;
const BAR_COLOR = isDarkMode() ? THEME_COLORS.accent.dark : THEME_COLORS.accent.light;

let allRows = [];
let inflationData = null;
let currentFiltered = [];
let currentYear = null;
let currentMonth = null;
let chart = null;

async function init() {
  try {
    [allRows, inflationData] = await Promise.all([fetchExpenseRows(), fetchInflationData()]);
  } catch (err) {
    document.getElementById('status').textContent = 'Помилка: ' + err.message;
    return;
  }
  if (allRows.length === 0) {
    document.getElementById('status').textContent = 'Немає даних для відображення.';
    return;
  }
  document.getElementById('status').textContent = '';

  checkNotifications().catch(() => {});

  const years = [...new Set(allRows.map(r => r.year))].sort((a, b) => b - a);
  renderYearButtons(years);
  selectYear(years[0]);
}

async function checkNotifications() {
  const notifications = [];
  const prevYear = new Date().getFullYear() - 1;

  const historyRows = await fetchHistoryRows();
  const hasHistoryForPrevYear = historyRows.some(r => r.year === prevYear);
  if (!hasHistoryForPrevYear) {
    notifications.push('Закінчився рік — оновіть історію витрат');
  }

  const inflationKey = `${prevYear}-12`;
  if (!inflationData || !inflationData[inflationKey]) {
    notifications.push('Закінчився рік — оновіть індекс інфляції');
  }

  renderNotifications(notifications);
}

function renderNotifications(notifications) {
  const container = document.getElementById('notifications');
  container.innerHTML = '';
  notifications.forEach(text => {
    const banner = document.createElement('div');
    banner.className = 'notification-banner';
    banner.innerHTML = '<span class="material-symbols-outlined">warning</span>';
    banner.append(text);
    container.appendChild(banner);
  });
}

function renderYearButtons(years) {
  const container = document.getElementById('years');
  container.innerHTML = '';
  years.forEach(year => {
    const btn = document.createElement('button');
    btn.textContent = year;
    btn.dataset.year = year;
    btn.onclick = () => selectYear(year);
    container.appendChild(btn);
  });
}

function selectYear(year) {
  currentYear = year;
  currentMonth = null;
  document.querySelectorAll('#years button').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.year) === year);
  });
  renderMonthButtons(year);
  applyFilters();
}

function renderMonthButtons(year) {
  const container = document.getElementById('months');
  container.innerHTML = '';

  const monthsWithData = new Set(allRows.filter(r => r.year === year).map(r => r.month));

  const allBtn = document.createElement('button');
  allBtn.className = 'all-months';
  allBtn.textContent = 'Всі місяці';
  allBtn.disabled = monthsWithData.size === 0;
  allBtn.onclick = () => selectMonth(null);
  container.appendChild(allBtn);

  for (let month = 1; month <= 12; month++) {
    const btn = document.createElement('button');
    btn.textContent = MONTH_NAMES[month - 1];
    btn.dataset.month = month;
    btn.disabled = !monthsWithData.has(month);
    btn.onclick = () => selectMonth(month);
    container.appendChild(btn);
  }

  highlightMonthButtons();
}

function highlightMonthButtons() {
  document.querySelectorAll('#months button').forEach(btn => {
    const isAllButton = !btn.dataset.month;
    const active = currentMonth === null ? isAllButton : Number(btn.dataset.month) === currentMonth;
    btn.classList.toggle('active', active);
  });
}

function selectMonth(month) {
  currentMonth = month;
  applyFilters();
}

function applyFilters() {
  highlightMonthButtons();

  const filtered = allRows.filter(r => r.year === currentYear && (currentMonth === null || r.month === currentMonth));
  const periodLabel = currentMonth ? `${MONTH_NAMES[currentMonth - 1]} ${currentYear}` : `${currentYear}`;

  const totals = {};
  for (const { category, amount } of filtered) {
    totals[category] = (totals[category] || 0) + amount;
  }
  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const labels = sorted.map(([category]) => category);
  const values = sorted.map(([, total]) => total);

  const canvas = document.getElementById('chart');
  canvas.width = Math.max(labels.length * 70, 600);

  if (chart) chart.destroy();
  chart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: `Витрати за ${periodLabel}`, data: values, backgroundColor: BAR_COLOR, borderRadius: 4 }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => formatCurrency(ctx.parsed.y) } }
      },
      scales: {
        y: { beginAtZero: true, ticks: { callback: value => formatCurrency(value) } },
        x: { ticks: { autoSkip: false, maxRotation: 90, minRotation: 45 } }
      },
      onHover: (evt, elements) => {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      onClick: (evt, elements, activeChart) => {
        const points = activeChart.getElementsAtEventForMode(evt, 'index', { intersect: false }, true);
        if (points.length) {
          const category = labels[points[0].index];
          window.location.href = `category-trends.html?category=${encodeURIComponent(category)}`;
        }
      }
    }
  });

  currentFiltered = filtered;
  renderBigTable(filtered);
  renderTotalWidget(filtered, periodLabel);
  renderAverageWidget();
}

function renderAverageWidget() {
  const monthlyTotals = new Array(12).fill(0);
  for (const r of allRows) {
    if (r.year === currentYear) monthlyTotals[r.month - 1] += r.amount;
  }
  const average = computeMonthlyAverage(monthlyTotals);
  document.getElementById('avg-amount').textContent = formatCurrency(average);
}

function renderBigTable(filtered) {
  const tbody = document.getElementById('big-table-body');
  tbody.innerHTML = '';

  const bigRows = filtered
    .filter(r => r.amount > bigAmountThreshold)
    .sort((a, b) => b.amount - a.amount);

  for (const { date, category, amount, comment } of bigRows) {
    const tr = document.createElement('tr');

    const dateTd = document.createElement('td');
    dateTd.textContent = date;
    tr.appendChild(dateTd);

    const catTd = document.createElement('td');
    const catCell = document.createElement('div');
    catCell.className = 'cat-cell';
    catCell.innerHTML = categoryIconHTML(category);
    catCell.append(category);
    catTd.appendChild(catCell);
    tr.appendChild(catTd);

    [formatCurrency(amount), comment].forEach(value => {
      const td = document.createElement('td');
      td.textContent = value;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
}

function renderTotalWidget(filtered, periodLabel) {
  const total = filtered.reduce((sum, r) => sum + r.amount, 0);
  document.getElementById('total-amount').textContent = formatCurrency(total);
  document.getElementById('total-period').textContent = periodLabel;
  document.getElementById('total-widget').onclick = () => {
    window.location.href = `monthly-trends.html?year=${currentYear}`;
  };
}

function applyThreshold() {
  const input = document.getElementById('threshold-input');
  const value = parseFloat(input.value);
  if (isNaN(value) || value < 0) return;
  bigAmountThreshold = value;
  renderBigTable(currentFiltered);
}

document.getElementById('threshold-apply').onclick = applyThreshold;
document.getElementById('threshold-input').addEventListener('keydown', evt => {
  if (evt.key === 'Enter') applyThreshold();
});

init().catch(err => {
  document.getElementById('status').textContent = 'Помилка: ' + err.message;
});
</script>

</body>
</html>
